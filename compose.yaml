# Self-hosting — the "three commands" promise:
#   git clone https://github.com/open-helpdesk/open-helpdesk && cd open-helpdesk
#   cp .env.example .env        # then fill in the secrets
#   docker compose up -d
#
# The application then answers on http://localhost:3000 (BASE_DOMAIN).
# With SEED_DEMO=true (the .env.example default), the instance starts with the
# Acme demo workspace — login marie.dupont@acme.example / demo-openhelpdesk,
# to be replaced by your own agents from the first session on.
#
# The internal hosts (postgres, redis, storage) are pinned here and take
# precedence over .env, written for development on the host machine's ports.

name: open-helpdesk-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openhelpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhelpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-openhelpdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openhelpdesk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for attachments. RustFS (Apache-2.0), pinned:
  # MinIO stopped publishing its community images, and `minio/minio` no longer
  # pulls from any public registry. Any S3 server works — the application only
  # creates its bucket and puts, gets and deletes objects (packages/storage).
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-openhelpdesk}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-openhelpdesk}
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openhelpdesk}:${POSTGRES_PASSWORD:-openhelpdesk}@postgres:5432/${POSTGRES_DB:-openhelpdesk}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openhelpdesk}:${POSTGRES_PASSWORD:-openhelpdesk}@postgres:5432/${POSTGRES_DB:-openhelpdesk}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openhelpdesk}:${POSTGRES_PASSWORD:-openhelpdesk}@postgres:5432/${POSTGRES_DB:-openhelpdesk}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Inbound email and imports write attachments.
      storage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
