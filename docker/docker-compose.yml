name: open-helpdesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openhelpdesk
      POSTGRES_PASSWORD: openhelpdesk
      POSTGRES_DB: openhelpdesk
    ports:
      # Host port shifted so the stack can coexist with other local Postgres
      # instances; override through OHD_POSTGRES_PORT.
      - "${OHD_POSTGRES_PORT:-5439}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhelpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${OHD_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (RustFS, Apache-2.0, pinned). MinIO stopped
  # publishing its community images: `minio/minio` no longer pulls. Console on
  # http://localhost:9011/rustfs/console/ (openhelpdesk / openhelpdesk).
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: openhelpdesk
      RUSTFS_SECRET_KEY: openhelpdesk
    ports:
      - "${OHD_STORAGE_PORT:-9010}:9000"
      - "${OHD_STORAGE_CONSOLE_PORT:-9011}:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development SMTP server: captures every email and displays it on
  # http://localhost:8026 (no email ever leaves the machine).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${OHD_MAILPIT_SMTP_PORT:-1026}:1025"
      - "${OHD_MAILPIT_UI_PORT:-8026}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  storagedata:
