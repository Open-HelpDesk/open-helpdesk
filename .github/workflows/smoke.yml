name: Smoke (end-to-end)

# Blocking, on every push to main and every pull request.
#
# It used to run nightly on a schedule only, and it was red every night from 31
# August to 9 September without anyone knowing: eighteen failures a night, all
# of them the V2 redesign moving the DOM the suite aimed at — plus one real
# regression it reported faithfully for ten days (the workspace logo had
# disappeared from the agent shell). A gate nobody reads is not a gate.
#
# The nightly run is kept: it is the one that catches what time breaks rather
# than what a commit breaks — an expired certificate, a dependency that drifted,
# a fixture that only ages badly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A second push to the same branch cancels the first: a queue of smoke runs on
# an outdated commit tells nobody anything and costs twenty minutes each.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm --filter @openhelpdesk/db db:rls
      - run: pnpm db:seed && pnpm db:seed:auth
      - run: pnpm --filter @openhelpdesk/web build
      # The magic-link email needs a real outbound path: the instance SMTP
      # fallback ships commented out in .env.example, and neither `tsx` nor
      # `next start` reads that file — the variables go on the processes.
      # Outbound emails go through the BullMQ outbox: without the worker the
      # magic link stays queued forever and the lifecycle test cannot pass.
      - name: Start worker
        env:
          SMTP_HOST: localhost
          SMTP_PORT: "1026"
          SMTP_SECURE: "false"
        run: pnpm --filter @openhelpdesk/worker start &
      - name: Start web
        env:
          BASE_DOMAIN: localhost:3006
          SMTP_HOST: localhost
          SMTP_PORT: "1026"
          SMTP_SECURE: "false"
        run: |
          pnpm --filter @openhelpdesk/web exec next start --port 3006 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3006/help && break
            sleep 2
          done
      - run: pnpm --filter @openhelpdesk/smoke smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/smoke/playwright-report/
