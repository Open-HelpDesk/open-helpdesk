name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run on demand: a push event that GitHub drops leaves a commit with no
  # check at all, and there is otherwise no way to ask for one.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version resolved from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck build
      # Les tests unitaires : aucune base, aucun réseau, moins d'une seconde.
      # Ils sont ici et non dans le smoke pour qu'une pull request puisse
      # toujours les faire tourner — une suite qui exige de l'infrastructure
      # finit sautée, et une suite sautée n'est plus une garantie.
      - run: pnpm test
      # La dérive entre le schéma et ses migrations. Ni le typecheck ni les
      # tests ne la voient : ils lisent le schéma TypeScript, pas la base. En
      # production, `migrate` n'aurait rien à appliquer et l'application
      # interrogerait une colonne absente — au premier client.
      - run: pnpm turbo run check:migrations
